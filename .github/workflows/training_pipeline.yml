name: Daily model training
on:
  schedule:
    - cron: "35 1 * * *"
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[hopsworks,lstm,explain,app,dev]"

      - name: Run leakage, artifact, and application quality gates
        run: pytest -q

      - name: Retrain selected production configurations and register
        run: >-
          python -m scripts.train_models
          --hopsworks
          --register
          --selected-configuration
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: DataProject
